[HEADER]
NAME=Top Speed

[CONTROLLER_0]
COMBINATOR=ADD 							; COMBINATOR MODE: ADD or MULT
INPUT=GAS							; telemetry channel input. SLIPRATIO_MAX SLIPRATIO_AVG LONG LATG BRAKE0-1 GAS0-1 STEER-1+1 SPEEDKMH GEAR
LUT=ers4_gas.lut						; input data to kers delivery lookup table
FILTER=0.96							; filter for eliminating spikes in variations and control variation speed
UP_LIMIT=1							; kers delivery max limit
DOWN_LIMIT=-1							; kers delivery min limit (can be negative)

[CONTROLLER_1]
COMBINATOR=ADD 							; COMBINATOR MODE: ADD or MULT
INPUT=BRAKE							; telemetry channel input. SLIPRATIO_MAX SLIPRATIO_AVG LONG LATG BRAKE0-1 GAS0-1 STEER-1+1 SPEEDKMH  GEAR
LUT=ers4_brake.lut						; input data to kers delivery lookup table
FILTER=0.96							; filter for eliminating spikes in variations and control variation speed
UP_LIMIT=1							; kers delivery max limit
DOWN_LIMIT=-1							; kers delivery min limit (can be negative)

[CONTROLLER_2]
COMBINATOR=MULT 							; COMBINATOR MODE: ADD or MULT
INPUT=SPEED_KMH						; telemetry channel input. SLIPRATIO_MAX SLIPRATIO_AVG LONG LATG BRAKE0-1 GAS0-1 STEER-1+1 SPEEDKMH  GEAR
LUT=ers4_speed.lut						; input data to kers delivery lookup table
FILTER=0.96							; filter for eliminating spikes in variations and control variation speed
UP_LIMIT=1							; kers delivery max limit
DOWN_LIMIT=-1	

[CONTROLLER_3]
COMBINATOR=MULT 							; COMBINATOR MODE: ADD or MULT
INPUT=GEAR							; telemetry channel input. SLIPRATIO_MAX SLIPRATIO_AVG LONG LATG BRAKE0-1 GAS0-1 STEER-1+1 SPEEDKMH GEAR
LUT=ers4_gear.lut						; input data to kers delivery lookup table
FILTER=0.96							; filter for eliminating spikes in variations and control variation speed
UP_LIMIT=1							; kers delivery max limit
DOWN_LIMIT=0							; kers delivery min limit (can be negative)

