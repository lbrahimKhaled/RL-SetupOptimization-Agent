[HEADER]
VERSION=1
POWER_CURVE=power.lut
COAST_CURVE=FROM_COAST_REF

[ENGINE_DATA]
ALTITUDE_SENSITIVITY=0.1
INERTIA=0.05
LIMITER=15000					; engine rev limiter. 0 no limiter
LIMITER_HZ=60
MINIMUM=2950

[COAST_REF]
RPM=15000
TORQUE=130
NON_LINEARITY=0					; coast engine brake from ZERO to TORQUE value at rpm with linear (0) to fully exponential (1)

[COAST_SETTINGS]
LUT=(0=0.205|1=0.20|2=0.19|3=0.18|4=0.16|5=0.14|6=0.12|7=0.10|8=0.08|9=0.06|10=0.04|11=0.02|12=0.0)
DEFAULT=9
ACTIVATION_RPM=4500



[COAST_DATA]
COAST0=0
COAST1=0
COAST=0.0000015

[COAST_CURVE]
FILENAME=coast.lut

[TURBO_0]
LAG_DN=0.9986					; Interpolation lag used slowing down the turbo
LAG_UP=0.9984					; Interpolation lag used to spin up the turbo
MAX_BOOST=3.5					; Maximum boost generated. This value is never exceeded and multiply the torque like T=T*(1.0 + boost), so a boost of 2 will give you 3 times the torque at a given rpm.
WASTEGATE=3.4					; Max level of boost before the wastegate does its things. 0 = no wastegate
DISPLAY_MAX_BOOST=3.0				; Value used by display apps
REFERENCE_RPM=5500				; The reference rpm where the turbo reaches maximum boost (at max gas pedal). 
GAMMA=5.75					; Turbo pressure sensitivity on accelerator pedal 2
COCKPIT_ADJUSTABLE=0				; cockpit adjustable turbo pressure


[DAMAGE]
TURBO_BOOST_THRESHOLD=3.3  ; level of TOTAL boost before the engine starts to take damage
TURBO_DAMAGE_K=5			; amount of damage per second per (boost - threshold)
RPM_THRESHOLD=15500			; RPM at which the engine starts to take damage
RPM_DAMAGE_K=1	


